<style>
:root{--bg:#07070A;--s1:#101014;--s2:#16161B;--bd:#24242B;--bd2:#2C2C34;--tx:#F4F4F5;--tx2:#C9C9D1;--mt:#9A9AA6;--dim:#7C7C88;--ac:#C6FF3D;--acd:rgba(198,255,61,.10);--acb:rgba(198,255,61,.35);--on:#0A0A0A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 120px;background-image:radial-gradient(420px 260px at 85% -40px,rgba(198,255,61,.10),transparent 70%);background-repeat:no-repeat}
.scr{display:flex;flex-direction:column;gap:20px;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--ac);color:var(--on);display:flex;align-items:center;justify-content:center}
.wm{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:500;letter-spacing:.02em}
.wm b{color:var(--ac);font-weight:500}
.ib{width:44px;height:44px;border-radius:14px;background:var(--s1);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib.on{background:var(--acd);border-color:var(--acb);color:var(--ac)}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--ac);color:var(--on);font:600 11px 'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;padding:0 5px}
.lbl{font:500 12px 'JetBrains Mono',monospace;letter-spacing:.14em;color:var(--mt)}
h1{margin:0;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.08}
h1.big{font-size:34px}
h1.mid{font-size:30px}
h1 em{font-style:normal;color:var(--ac)}
h2{margin:0;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600}
.sub{margin:0;font-size:14px;line-height:1.5;color:var(--mt)}
.hd{display:flex;flex-direction:column;gap:10px}
.sec{display:flex;flex-direction:column;gap:14px}
.sech{display:flex;align-items:baseline;justify-content:space-between}
.sech small{font:400 12px 'JetBrains Mono',monospace;color:var(--mt)}
.search{height:52px;border-radius:16px;background:var(--s1);border:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;color:var(--mt)}
.search:focus-within{border-color:var(--acb)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:15px;color:var(--tx)}
.search input::placeholder{color:var(--dim)}
.search .go{width:38px;height:38px;border-radius:12px;background:var(--ac);color:var(--on);display:flex;align-items:center;justify-content:center;flex:none}
.search .clr{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--mt)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:12px;background:var(--s1);border:1px solid var(--bd);color:var(--tx2);font-size:13px;font-weight:500;display:flex;align-items:center}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.chips.f .chip.on{background:var(--tx);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cat{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.cat:active,.row:active,.card:active{transform:scale(.98)}
.cic{width:44px;height:44px;border-radius:14px;background:var(--acd);color:var(--ac);display:flex;align-items:center;justify-content:center}
.cat b{font-size:15px;font-weight:600;display:block}
.cat small{font:400 12px 'JetBrains Mono',monospace;color:var(--mt);display:block;margin-top:3px}
.list{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:4px;background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:12px 8px 12px 14px}
.rowmain{flex:1;min-width:0;display:flex;align-items:center;gap:14px}
.mono-tile{flex:none;width:48px;height:48px;border-radius:14px;background:var(--s2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font:500 15px 'JetBrains Mono',monospace;color:var(--ac)}
.rt{min-width:0;display:flex;flex-direction:column;gap:3px}
.rt b{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt small{font:400 12px 'JetBrains Mono',monospace;color:var(--mt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--dim);border-radius:14px}
.star.on{color:var(--ac)}
.pill{font:500 11px 'JetBrains Mono',monospace;color:var(--mt);border:1px solid var(--bd2);border-radius:8px;padding:4px 9px;letter-spacing:.02em;display:inline-block}
.pill.ac{color:var(--ac);border-color:var(--acb)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--acd);border:1px solid var(--acb);border-radius:18px;padding:14px 16px;font-size:13px;line-height:1.5;color:var(--tx2)}
.note svg{flex:none;color:var(--ac);margin-top:1px}
.cnt{font:400 12px 'JetBrains Mono',monospace;color:var(--mt)}
.empty{border:1.5px dashed #34343D;border-radius:20px;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.empty b{font-size:15px;font-weight:600}
.empty span{font-size:13px;color:var(--mt);line-height:1.5}
.btn{height:56px;border-radius:18px;background:var(--ac);color:var(--on);display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:600;width:100%;text-align:center}
.btn.ghost{background:var(--s1);color:var(--tx);border:1px solid var(--bd);font-weight:500;height:52px;font-size:15px}
.btn.sm{height:44px;width:auto;padding:0 18px;font-size:14px;border-radius:14px}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.big-tile{width:76px;height:76px;border-radius:24px;background:var(--s1);border:1px solid var(--acb);display:flex;align-items:center;justify-content:center;font:500 26px 'JetBrains Mono',monospace;color:var(--ac)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:20px}
.kv{padding:16px;display:flex;flex-direction:column;gap:10px}
.kv .k{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--dim)}
.kv code{font:400 13px/1.5 'JetBrains Mono',monospace;color:var(--ac);word-break:break-all}
.kvr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stat{display:flex;padding:16px}
.stat>div{flex:1;display:flex;flex-direction:column;gap:4px}
.stat b{font:700 26px 'Space Grotesk',sans-serif}
.stat small{font-size:12px;color:var(--mt)}
.ava{width:64px;height:64px;border-radius:20px;background:var(--acd);border:1px solid var(--acb);color:var(--ac);display:flex;align-items:center;justify-content:center;font:700 26px 'Space Grotesk',sans-serif;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:#0B0B0E;border-top:1px solid #1C1C22}
nav.tabs .in{display:flex;width:100%;max-width:520px;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 14px)}
.tab{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);font-size:11px;font-weight:500;text-align:center}
.tab.on{color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,12px);background:var(--tx);color:var(--on);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:10;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.scr{animation:none}*{transition:none!important}}
</style>
</head>

  '<div class="hd"><h1 class="mid">Твой <em>арсенал</em></h1><p class="sub">Сохранённые инструменты всегда под рукой.</p></div>'+
  '<div class="list">'+list.map(function(t){return row(t,true)}).join('')+'</div>'+
  '<button class="empty" data-a="all" style="width:100%;color:inherit"><span class="cic">'+ic('plus')+'</span><b>Добавить из каталога</b><span>Нажми на звезду рядом с инструментом</span></button></div>';
}
function profile(){
  var u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  var name=u?[u.first_name,u.last_name].filter(Boolean).join(' '):'Гость';
  var av=u&&u.photo_url?'<img src="'+esc(u.photo_url)+'" alt="">':esc((name[0]||'G').toUpperCase());
  return '<div class="scr"><div class="top"><span class="lbl">ПРОФИЛЬ</span><span style="width:44px"></span></div>'+
  '<div style="display:flex;align-items:center;gap:16px"><div class="ava">'+av+'</div><div class="hd" style="gap:4px"><h1 style="font-size:24px">'+esc(name)+'</h1><p class="sub" style="font-family:\'JetBrains Mono\',monospace;font-size:13px">'+(u&&u.username?'@'+esc(u.username):esc(CONFIG.BOT_NAME))+'</p></div></div>'+
  '<div class="card stat"><div><b>'+favs.size+'</b><small>в избранном</small></div><div><b>'+CATS.length+'</b><small>разделов</small></div><div><b>'+TOOLS.length+'</b><small>инструментов</small></div></div>'+
  '<div class="list"><button class="btn ghost" data-a="suggest">Предложить инструмент</button>'+
  '<button class="btn ghost" data-a="clearfavs" style="color:var(--mt)">Очистить избранное</button></div>'+
  '<p class="sub" style="text-align:center">'+esc(CONFIG.BOT_NAME)+' · каталог открытых инструментов. Используйте законно и этично.</p></div>';
}
var START=["nickname-1","domain-22","email-1","domain-4"];
/* ====== РЕНДЕР И НАВИГАЦИЯ ====== */
function render(y){
  var s=state.screen;
  $('app').innerHTML=({home:home,catalog:catalog,tool:tool,favs:favsScreen,profile:profile})[s]();
  var active=s==='tool'?'catalog':s;
  $('tabs').innerHTML=[['home','Главная','home'],['catalog','Каталог','grid'],['favs','Избранное','heart'],['profile','Профиль','user']].map(function(t){
    return '<button class="tab'+(active===t[0]?' on':'')+'" data-a="tab" data-v="'+t[0]+'"'+(active===t[0]?' aria-current="page"':'')+'>'+ic(t[2])+t[1]+'</button>';
  }).join('');
  if(s==='catalog')refreshCatalog();
  window.scrollTo(0,y||0);
  if(tg&&tg.BackButton){try{stack.length?tg.BackButton.show():tg.BackButton.hide()}catch(e){}}
}
function go(next){var snap={};for(var k in state)snap[k]=state[k];snap.y=window.scrollY;stack.push(snap);for(var k2 in next)state[k2]=next[k2];render(0)}
function tab(s){stack.length=0;state.screen=s;state.cat=null;state.q='';state.filter='all';state.toolId=null;render(0)}
function back(){
  if(!stack.length){tab('home');return}
  var s=stack.pop(),y=s.y;delete s.y;for(var k in s)state[k]=s[k];render(y);
}
if(tg&&tg.BackButton){try{tg.BackButton.onClick(back)}catch(e){}}
/* ====== СОБЫТИЯ ====== */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,v=el.dataset.v,t=v&&byId[v];
  if(a==='tab'){haptic();tab(v)}
  else if(a==='all'){haptic();go({screen:'catalog',cat:null,q:'',filter:'all'})}
  else if(a==='cat'){
    haptic();
    if(state.screen==='catalog'){state.cat=v||null;refreshCatalog()}
    else go({screen:'catalog',cat:v||null,q:'',filter:'all'});
  }
  else if(a==='filter'){state.filter=v;refreshCatalog()}
  else if(a==='reset'){state.cat=null;state.q='';state.filter='all';var q=$('q');if(q)q.value='';refreshCatalog()}
  else if(a==='open'&&t){
    haptic();recent=[t.id].concat(recent.filter(function(i){return i!==t.id})).slice(0,8);store.set('recent',recent);
    go({screen:'tool',toolId:t.id});
  }
  else if(a==='back'){haptic();back()}
  else if(a==='fav'&&t){
    if(favs.has(t.id)){favs.delete(t.id);toast('Убрано из избранного')}else{favs.add(t.id);toast('Добавлено в избранное')}
    saveFavs();haptic('medium');
    var y=window.scrollY;
    if(state.screen==='catalog'){refreshCatalog()}else{render(y)}
  }
  else if(a==='link'&&t){haptic();openLink(t.u)}
  else if(a==='copy'&&t){copyText(t.u)}
  else if(a==='share'&&t){
    var link='https://t.me/share/url?url='+encodeURIComponent(t.u)+'&text='+encodeURIComponent(t.n+' — '+catBy[t.c].name);
    if(tg&&tg.openTelegramLink){try{tg.openTelegramLink(link);return}catch(er){}}
    if(navigator.share){navigator.share({title:t.n,url:t.u}).catch(function(){})}else copyText(t.u);
  }
  else if(a==='suggest'){if(CONFIG.SUGGEST_URL){if(tg&&tg.openTelegramLink&&/^https:\/\/t\.me\//.test(CONFIG.SUGGEST_URL)){tg.openTelegramLink(CONFIG.SUGGEST_URL)}else openLink(CONFIG.SUGGEST_URL)}else toast('Укажи SUGGEST_URL в настройках файла')}
  else if(a==='clearfavs'){
    if(!favs.size){toast('Избранное уже пусто');return}
    var doIt=function(){favs.clear();saveFavs();render(0);toast('Избранное очищено')};
    if(tg&&tg.showConfirm){tg.showConfirm('Очистить всё избранное?',function(ok){ok&&doIt()})}else if(window.confirm('Очистить всё избранное?'))doIt();
  }
});
document.addEventListener('input',function(e){if(e.target.id==='q'){state.q=e.target.value;refreshCatalog()}});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.dataset.form==='home'){var v=$('hq').value.trim();go({screen:'catalog',cat:null,q:v,filter:'all'})}
});
render(0);
})();
</script>
</body>
</html>
